services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 5s
      retries: 10

  # apps
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - 3000:3000
    depends_on:
      - postgres
    env_file:
      - .env

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    container_name: app
    restart: always
    ports:
      - 4200:4200
    depends_on:
      - api
    environment:
      # prevent SSRF for local development 
      - NG_ALLOWED_HOSTS=localhost

volumes:
  db-data:
