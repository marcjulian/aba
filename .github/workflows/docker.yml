name: Docker

on:
  push:
    branches: ['main']
  # build manually for pull request
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: aba-app
  API_IMAGE_NAME: aba-api
  PRISMA_MIGRATE_IMAGE_NAME: aba-prisma-migrate

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build

      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # comment out for now - enable when db changes or trigger manually?
      - name: Docker meta prisma-migrate
        id: meta-prisma-migrate
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PRISMA_MIGRATE_IMAGE_NAME }}

      - name: Build Prisma Migrate Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: prisma/Dockerfile
          push: true
          tags: ${{ steps.meta-prisma-migrate.outputs.tags }}
          labels: ${{ steps.meta-prisma-migrate.outputs.labels }}

      - name: Docker meta app
        id: meta-app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP_IMAGE_NAME }}

      - name: Build App Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}

      - name: Docker meta api
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.API_IMAGE_NAME }}

      - name: Build API Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
