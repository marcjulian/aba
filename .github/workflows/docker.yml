name: Docker Image Publish

on:
  push:
    branches: ['main']
    tags: ['*']
  # build manually for pull request
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare-app-builds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build apps for docker
        run: pnpm run build:docker

      - name: Upload app build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: app-builds
          if-no-files-found: error
          path: |
            dist/apps/app
            dist/apps/api

  publish-app-images:
    runs-on: ubuntu-latest
    needs: prepare-app-builds
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: app
            image-name: aba-app
            dockerfile: apps/app/Dockerfile
          - name: api
            image-name: aba-api
            dockerfile: apps/api/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download app build artifacts
        uses: actions/download-artifact@v6
        with:
          name: app-builds
          path: dist/apps

      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta ${{ matrix.image.name }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.image-name }}

      - name: Build ${{ matrix.image.name }} Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
