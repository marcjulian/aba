name: Prisma Migrate

on:
  push:
    branches: ['main']
    tags: ['*']
    paths:
      - 'prisma/migrations/**/migration.sql'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PRISMA_MIGRATE_IMAGE_NAME: aba-prisma-migrate

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for new Prisma migrations
        id: prisma-migrations
        if: github.event_name == 'push'
        shell: bash
        run: |
          base="${{ github.event.before }}"

          if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base="HEAD^"
          fi

          if git diff --name-only --diff-filter=A "$base" "${{ github.sha }}" -- 'prisma/migrations/*/migration.sql' | grep -q .; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to registry ${{ env.REGISTRY }}
        if: github.event_name == 'workflow_dispatch' || steps.prisma-migrations.outputs.created == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta prisma-migrate
        if: github.event_name == 'workflow_dispatch' || steps.prisma-migrations.outputs.created == 'true'
        id: meta-prisma-migrate
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PRISMA_MIGRATE_IMAGE_NAME }}

      - name: Build Prisma Migrate Docker Image
        if: github.event_name == 'workflow_dispatch' || steps.prisma-migrations.outputs.created == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: prisma/Dockerfile
          push: true
          tags: ${{ steps.meta-prisma-migrate.outputs.tags }}
          labels: ${{ steps.meta-prisma-migrate.outputs.labels }}
